; PlatformIO Project Configuration File
;
; ESP32-S3-WROOM with a single BMV080 particulate matter sensor.
; Derived from POLVERINE_FULL_BLE_DEMO, the BME690/BSEC part, the BLE part
; and the link to the robot have been removed.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = espidf

; 4 MB is the smallest WROOM-1 variant, the partition table stays below that
; so that the same build also runs on the 8 MB and 16 MB modules.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv

build_flags =
	-std=gnu17
	-Wall
	-mlongcalls
	-Wno-frame-address
	-Wl,--static
	-O2

	; Bosch BMV080 SDK, bundled under deps/ so the project is self contained.
	; BARE_BUILD selects the variant without file I/O, which the PFF export would need.
	-DBARE_BUILD=1
	-I$PROJECT_DIR/deps/bosch-sensortec/BMV080-SDK/api/inc
	-I$PROJECT_DIR/deps/bosch-sensortec/BMV080-SDK/api_examples/_common/inc
	-L$PROJECT_DIR/deps/bosch-sensortec/BMV080-SDK/api/lib/xtensa_esp32s3/xtensa_esp32s3_elf_gcc/release
	-l_postProcessor
	-l_bmv080

extra_scripts = pre:before_build.py

; The stub loader is unreliable over the native USB port of the S3
; ("Invalid head of packet"), a slower link and the ROM loader are steadier.
upload_speed = 115200
upload_flags =
	--no-stub

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
