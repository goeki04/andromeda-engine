name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Andromeda Engine (Windows)
    # VS 2022 (MSVC 19.4x) to match profiles/vs2022: ConanCenter ships prebuilt
    # binaries for it. windows-latest has moved to VS 2026 (MSVC 19.5x), where most
    # dependencies would have to build from source.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('andromeda/conanfile.py', 'andromeda/conan-recipes/**', 'andromeda/profiles/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install Conan
        run: pip install conan

      - name: Configure Multicore Build
        run: |
          echo "CL=/MP" >> $GITHUB_ENV
          echo "CONAN_CPU_COUNT=4" >> $GITHUB_ENV

      # Same profile as build.ps1 for host and build context. Passing it as -pr:b
      # matters: the detected default profile uses cppstd 14, which the build tools
      # (spirv-tools via glslang) reject.
      - name: Detect Conan profile
        run: conan profile detect --force

      # Recipes that are not on ConanCenter (see build.ps1). Without this step
      # `conan install` cannot resolve libclang and directx-shader-compiler.
      - name: Export local Conan recipes
        working-directory: andromeda
        run: |
          conan export ./conan-recipes/directx-shader-compiler --version 1.9.2602
          conan export ./conan-recipes/libclang --version 21.1.8

      - name: Install dependencies
        working-directory: andromeda
        run: >
          conan install .
          -pr profiles/vs2022 -pr:b profiles/vs2022
          -g VirtualBuildEnv
          -s build_type=Release
          -of conan/
          --build=missing

      - name: Configure
        working-directory: andromeda
        shell: cmd
        run: |
          call conan\build\Release\generators\conanbuild.bat
          cmake --preset conan-release

      - name: Build
        working-directory: andromeda
        shell: cmd
        run: |
          call conan\build\Release\generators\conanbuild.bat
          cmake --build --preset conan-release

      # Unit tests (offline, no GPU) and network tests (the WebSocket client against
      # local mock servers on 127.0.0.1, no internet) both have to pass. The GL suite
      # stays out - it needs a display and is gated behind -DANDROMEDA_BUILD_GL_TESTS=ON
      # for local runs. Per-test timeouts are set in tests/CMakeLists.txt.
      - name: Test
        working-directory: andromeda
        shell: cmd
        run: |
          call conan\build\Release\generators\conanbuild.bat
          ctest --preset conan-release -L "unit|network" --output-on-failure --output-junit test-results.xml

      # Kept even when the tests fail - that is when the per-test results are needed.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: andromeda/conan/build/Release/test-results.xml
          if-no-files-found: ignore

  engine-linux:
    name: Andromeda Engine (Linux)
    runs-on: ubuntu-24.04
    # The Linux path (Dockerfile + profiles/linux) has never been exercised by
    # CI and is not expected to be green yet. Reported, but not merge-blocking.
    # Remove this line once the build passes.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev \
            xorg-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev

      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('andromeda/conanfile.py', 'andromeda/conan-recipes/**', 'andromeda/profiles/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install Conan
        run: pip install conan

      # profiles/linux pins compiler.version, which must match whatever clang
      # the runner actually ships. Detect it instead of hardcoding.
      - name: Detect Clang version
        run: echo "CLANG_MAJOR=$(clang --version | sed -n 's/.*version \([0-9]*\).*/\1/p' | head -1)" >> $GITHUB_ENV

      # Recipes that are not (or not correctly) on ConanCenter (see build.sh).
      # kuba-zip is needed here but not on Windows: with clang there are no prebuilt
      # binaries, and building ConanCenter's recipe from source fails its sha256 check.
      - name: Export local Conan recipes
        working-directory: andromeda
        run: |
          conan export ./conan-recipes/directx-shader-compiler --version 1.9.2602
          conan export ./conan-recipes/kuba-zip --version 0.3.0

      - name: Install dependencies
        working-directory: andromeda
        run: >
          conan install .
          -pr profiles/linux -pr:b profiles/linux
          -s compiler.version=$CLANG_MAJOR
          -s:b compiler.version=$CLANG_MAJOR
          -s build_type=Release
          -of conan/
          --build=missing

      - name: Configure
        working-directory: andromeda
        run: cmake --preset conan-release

      - name: Build
        working-directory: andromeda
        run: cmake --build --preset conan-release

      - name: Test
        working-directory: andromeda
        run: ctest --preset conan-release -L "unit|network" --output-on-failure --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: andromeda/conan/build/Release/test-results.xml
          if-no-files-found: ignore

  launcher:
    name: Andromeda Launcher
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Inject Github Token
        working-directory: andromeda_launcher
        shell: bash
        run: |
          mkdir -p lib
          echo "const String kGithubToken = '${{ secrets.GH_TOKEN }}';" > lib/config.dart
          # Generated file: format it, so the formatting check below only judges real sources.
          dart format lib/config.dart

      - name: Get dependencies
        working-directory: andromeda_launcher
        run: flutter pub get

      - name: Verify formatting
        working-directory: andromeda_launcher
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: andromeda_launcher
        run: flutter analyze

      - name: Build Windows
        working-directory: andromeda_launcher
        run: flutter build windows --release
